# pnpm 10+ refuses to run dependency install scripts unless they are approved
# here. In CI that refusal is a hard failure, not the warning shown locally —
# an unapproved entry exits 1 and the deploy never reaches the build step.
allowBuilds:
  # tsx needs esbuild's platform binary for the seed and migration scripts.
  esbuild: true
  # Next's image optimizer for the local files under /images.
  sharp: true
  # Module resolver used by eslint-config-next.
  unrs-resolver: true
