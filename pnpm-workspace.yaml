# pnpm 10+ refuses to run dependency install scripts unless they are approved
# here. In CI that refusal is a hard failure, not the warning shown locally —
# an unapproved entry exits 1 and the deploy never reaches the build step.
allowBuilds:
  # tsx needs esbuild's platform binary for the seed and migration scripts.
  esbuild: true
  # Next's image optimizer for the local files under /images.
  sharp: true
  # Module resolver used by eslint-config-next.
  unrs-resolver: true

# Security floors for packages that only arrive through other packages
# (2026-11-17 `pnpm audit`). All are build/lint/test tooling except
# source-map-js, which Next's postcss uses at build time; none ship to the
# browser. Drop an entry once its parent requires the patched version itself.
overrides:
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  "source-map-js@<1.2.2": "^1.2.2"
  "zod@>=4.0.0 <4.6.6": "^4.6.6"
  "undici@>=8.0.0 <8.12.2": "^8.12.2"
  "vite@>=8.3.0 <8.3.3": "^8.3.3"
